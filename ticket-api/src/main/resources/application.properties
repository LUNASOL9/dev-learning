spring.application.name=ticket-api

spring.datasource.url=jdbc:h2:file:./data/tickets
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always

#테이블을 자동 변경하지 않도록
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 로컬 Ollama 서버 주소
spring.ai.ollama.base-url=http://localhost:11434

# OLLAMA_CHAT_MODEL 환경변수가 있으면 사용하고,
# 없으면 기본 모델 qwen3:1.7b 사용
#
# PC별 모델 설정 방법:
# 1. PS C:\Users\luna\Documents\dev-learning> 에서 ollama list로 정확한 모델 이름 확인
# 2. 아래 명령의 "모델 이름"을 바꿔 PowerShell에서 실행
# [Environment]::SetEnvironmentVariable(
#   "OLLAMA_CHAT_MODEL",
#   "모델 이름",
#   "User"
# )
# 3. VS Code를 완전히 종료하고 다시 실행
# 4. 새 터미널에서 $env:OLLAMA_CHAT_MODEL로 확인
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen3:1.7b}

# 연결 실패 → 기다림 → 재시도 → 실패 → 기다림…
# 첫 시도만 수행하고 자동 재시도하지 않음
# 연결 실패 → 추가 재시도 없음 → 우리 catch로 전달 → 503 안내
spring.ai.retry.max-attempts=1


# 서버와 연결을 맺을 때 얼마나 기다릴지
spring.http.clients.connect-timeout=5s
# 연결 후 응답(Ollama)을 읽을 때 얼마나 기다릴지 Ollama 전용 속성은 아니님
spring.http.clients.read-timeout=120s